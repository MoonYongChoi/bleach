name: Scrape campaigns

on:
  schedule:
    # 매시 17분 (정각은 GitHub 예약 실행이 몰려 늦어지기 쉽다). cron은 UTC 기준이지만 매시라 차이 없음.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "일부 커넥터만 (예: revu,pavlovu). 비우면 전부"
        default: ""
      dry_run:
        description: "DB에 쓰지 않고 정제 리포트만"
        type: boolean
        default: false

# 한 회차가 한 시간을 넘기면 다음 회차는 앞 회차가 끝날 때까지 기다린다 (동시에 DB에 쓰지 않게)
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Test normalization rules
        run: python -m unittest discover -s tests

      - name: Run scrapers and load into Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVU_ID: ${{ secrets.REVU_ID }}
          REVU_PW: ${{ secrets.REVU_PW }}
        run: |
          args=""
          if [ -n "${{ inputs.only }}" ]; then args="$args --only ${{ inputs.only }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          python run_all.py $args
