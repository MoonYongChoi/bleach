name: Verify against source sites

# DB에 적재된 활성 캠페인 전체를 원본 사이트 상세 페이지와 대조하는 검수 (scraper/verify.py).
# 결과는 실행 화면의 Summary 탭에 표로 남는다. DB에는 쓰지 않는다.

on:
  workflow_dispatch:
    inputs:
      per:
        description: "플랫폼별 표본 수 (0 = 전수)"
        default: "0"
  schedule:
    # 매주 월요일 10:15 KST (cron은 UTC 기준이라 01:15)
    - cron: "15 1 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Compare DB with source pages
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVU_ID: ${{ secrets.REVU_ID }}
          REVU_PW: ${{ secrets.REVU_PW }}
        run: python verify.py --per "${{ inputs.per || '0' }}"

      - name: Upload per-campaign results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-result
          path: scraper/verify_result.csv
          if-no-files-found: ignore
