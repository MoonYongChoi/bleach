name: Verify against source sites

# DB에 적재된 캠페인을 원본 사이트 상세 페이지와 대조하는 표본 검수 (scraper/verify.py).
# 결과는 실행 화면의 Summary 탭에 표로 남는다. DB에는 쓰지 않는다.

on:
  workflow_dispatch:
    inputs:
      per:
        description: "플랫폼별 표본 수"
        default: "15"
  schedule:
    # 매주 월요일 10:15 KST
    - cron: "15 1 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Compare DB with source pages
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVU_ID: ${{ secrets.REVU_ID }}
          REVU_PW: ${{ secrets.REVU_PW }}
        run: python verify.py --per "${{ inputs.per || '15' }}"
