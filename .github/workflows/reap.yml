name: End campaigns that left the source sites

# 수집 목록에서 한동안 안 보인 캠페인의 자기 페이지를 열어서, 닫혔거나 사라졌으면 종료(is_active=false) 처리한다
# (scraper/reaper.py). 수동 실행은 기본이 미리보기이고, apply를 켜야 DB가 바뀐다.
# 매일 새벽 04:30(KST)에는 자동으로 실제 종료 처리까지 한다 (수집 03:30 직후, cron은 UTC라 19:30).

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true면 실제로 종료 처리 (기본은 미리보기)"
        type: boolean
        default: false
      per:
        description: "플랫폼별 검사 건수 제한 (0 = 전부)"
        default: "0"
      only:
        description: "일부 커넥터만 (예: revu,reviewnote). 비우면 전부"
        default: ""
      stale_hours:
        description: "이 시간 넘게 수집 목록에서 안 보인 캠페인만 검사"
        default: "24"

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check stale campaigns
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REVU_ID: ${{ secrets.REVU_ID }}
          REVU_PW: ${{ secrets.REVU_PW }}
        run: |
          args="--stale-hours ${{ inputs.stale_hours || '24' }} --per ${{ inputs.per || '0' }}"
          if [ -n "${{ inputs.only }}" ]; then args="$args --only ${{ inputs.only }}"; fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then args="$args --apply"; fi
          python reaper.py $args
